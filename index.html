<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרלמנט הצעירים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 5% auto;
        }
        .logo {
            width: 8%;
            height: auto;
            margin: 2% auto;
            display: block;
        }
        nav {
            background: #005bb5;
            padding: 1%;
            margin-bottom: 3%;
        }
        nav a, footer a {
            color: white;
            text-decoration: none;
            margin: 2%;
            font-size: 1.2em;
            transition: color 0.3s ease-in-out, transform 0.2s ease-in-out;
        }
        nav a:hover, footer a:hover {
            color: #ffcc00;
            transform: scale(1.1);
        }
        .content {
            padding: 5%;
            background: white;
            margin-top: 2%;
            border-radius: 10px;
        }
        footer {
            margin-top: 5%;
            padding: 2%;
            background: #0073e6;
            color: white;
        }
        @media (max-width: 600px) {
            nav { margin-bottom: 5%; }
            .container { margin: 8% auto; }
            footer { margin-top: 8%; }
            nav a { font-size: 1em; }
            .logo { width: 30%; }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="לוגו פרלמנט הצעירים" class="logo">
    </header>
    <nav>
        <a href="#about">אודות</a>
        <a href="#mission">חזון</a>
        <a href="#contact">צור קשר</a>
    </nav>
    <div class="container">
        <section id="about" class="content">
            <h2>?מי אנחנו</h2>
            <p>פרלמנט הצעירים הוא יוזמה לקידום מעורבות אזרחית בקרב הדור הצעיר</p>
        </section>
        <section id="mission" class="content">
            <h2>החזון שלנו</h2>
            <p>ליצור מקום שבו לצעירים יש קול משמעותי בקבלת החלטות מדיניות</p>
        </section>
        <section id="contact" class="content">
            <h2>צור קשר</h2>
            <p>מוזמנים לפנות אלינו למידע נוסף ולהצטרף למאבק החברתי</p>
        </section>
    </div>
    <footer>
        &copy; 2025 כל הזכויות שמורות - פרלמנט הצעירים<br><br>
        <a href="https://sagiv23.github.io" style="text-decoration: none;" target="_blank">Sagiv23</a> :מבית
    </footer>
</body>
</html>
